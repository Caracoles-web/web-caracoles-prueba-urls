name: AUDITOR + SEO AUTO CARACOLES

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: seo-caracoles
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Definir modo
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "mode=light" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: SEO AUTO seguro
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base="https://www.asadorcaracoles.es"
          urls=[
            f"{base}/",f"{base}/en/",f"{base}/fr/",
            f"{base}/carta/",f"{base}/en/carta.html",f"{base}/fr/carta.html",
            f"{base}/Eventos/",f"{base}/en/eventos.html",f"{base}/fr/eventos.html",
            f"{base}/reservas/",f"{base}/en/contacto.html",f"{base}/fr/contacto.html",
            f"{base}/privacy/",f"{base}/en/legal.html",f"{base}/fr/legal.html",
          ]
          robots=f"User-agent: *\nAllow: /\n\nSitemap: {base}/sitemap.xml\n"
          sitemap=['<?xml version="1.0" encoding="UTF-8"?>',
                   '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in urls:
              sitemap += ["  <url>",f"    <loc>{u}</loc>","  </url>"]
          sitemap += ["</urlset>"]
          expected={"robots.txt":robots,"sitemap.xml":"\n".join(sitemap)+"\n"}
          changed=[]
          for name,content in expected.items():
              p=Path(name)
              old=p.read_text(encoding="utf-8") if p.exists() else None
              if old != content:
                  p.write_text(content,encoding="utf-8"); changed.append(name)
          Path("/tmp/auto.txt").write_text("\n".join(changed),encoding="utf-8")
          PY

          if [[ -s /tmp/auto.txt ]]; then
            git config user.name "SEO AUTO CARACOLES"
            git config user.email "actions@users.noreply.github.com"
            git add robots.txt sitemap.xml
            git commit -m "chore(seo): mantener robots y sitemap [skip ci]"
            git push origin HEAD:main || echo "push_failed" > /tmp/push_failed
          fi

      - name: Auditar
        id: audit
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re,subprocess

          root=Path(".")
          mode=os.environ["MODE"]
          critical=[]
          warnings=[]

          pages={
            "index.html":"/","en/index.html":"/en/","fr/index.html":"/fr/",
            "carta/index.html":"/carta/","en/carta.html":"/en/carta.html","fr/carta.html":"/fr/carta.html",
            "Eventos/index.html":"/Eventos/","en/eventos.html":"/en/eventos.html","fr/eventos.html":"/fr/eventos.html",
            "reservas/index.html":"/reservas/","en/contacto.html":"/en/contacto.html","fr/contacto.html":"/fr/contacto.html",
            "privacy/index.html":"/privacy/","en/legal.html":"/en/legal.html","fr/legal.html":"/fr/legal.html",
          }
          base="https://www.asadorcaracoles.es"

          if mode=="light":
              try:
                  changed=subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"],text=True).splitlines()
              except Exception:
                  changed=[]
              targets=[p for p in pages if p in changed]
          else:
              targets=list(pages)

          def check_ref(page,ref):
              clean=ref.split("#",1)[0].split("?",1)[0].strip()
              if not clean or clean.startswith(("http://","https://","mailto:","tel:","data:","javascript:","#")):
                  return
              target=root/clean.lstrip("/") if clean.startswith("/") else page.parent/clean
              if target.is_dir(): target=target/"index.html"
              elif not target.suffix:
                  if (target/"index.html").exists(): target=target/"index.html"
                  elif target.with_suffix(".html").exists(): target=target.with_suffix(".html")
              if target.exists(): return
              norm=clean.replace("\\","/").lower()
              if "/cartas/" in f"/{norm}" or norm.startswith("assets/cartas/"):
                  warnings.append(f"📄 CARTA/VINOS — `{page.as_posix()}` enlaza a `{clean}` y no existe. SOLO AVISO.")
              else:
                  critical.append(f"`{page.as_posix()}` enlaza a recurso inexistente: `{clean}`.")

          for rel in targets:
              page=root/rel
              if not page.is_file():
                  critical.append(f"Falta página pública: `{rel}`."); continue
              html=page.read_text(encoding="utf-8",errors="replace")

              if not re.search(r"<title\b[^>]*>.*?</title>",html,re.I|re.S):
                  critical.append(f"`{rel}` no tiene `<title>`.")
              if not re.search(r'<meta\b[^>]*name=["\']description["\'][^>]*>',html,re.I):
                  critical.append(f"`{rel}` no tiene meta description.")
              if re.search(r'<meta\b[^>]*name=["\']robots["\'][^>]*content=["\'][^"\']*noindex',html,re.I):
                  critical.append(f"`{rel}` contiene `noindex`. REVISIÓN HUMANA.")

              cans=re.findall(r'<link\b[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)["\']',html,re.I)
              expected=base+pages[rel]
              if len(cans)!=1 or cans[0]!=expected:
                  critical.append(f"`{rel}` canonical requiere revisión humana.")

              if mode=="full":
                  for lang in ("es","en","fr","x-default"):
                      if not re.search(rf'<link\b[^>]*hreflang=["\']{lang}["\']',html,re.I):
                          critical.append(f"`{rel}` carece de hreflang `{lang}`.")

              for _,ref in re.findall(r'\b(href|src)=["\']([^"\']+)["\']',html,re.I):
                  check_ref(page,ref)

          if mode=="full":
              if not (root/"robots.txt").is_file(): critical.append("Falta `robots.txt`.")
              if not (root/"sitemap.xml").is_file(): critical.append("Falta `sitemap.xml`.")
              aliases={
                  "menu":("../carta/","https://www.asadorcaracoles.es/carta/"),
                  "contact":("../reservas/","https://www.asadorcaracoles.es/reservas/"),
                  "contacto":("../reservas/","https://www.asadorcaracoles.es/reservas/"),
                  "private-events":("../Eventos/","https://www.asadorcaracoles.es/Eventos/"),
              }
              for alias,(target,canonical) in aliases.items():
                  p=root/alias/"index.html"
                  if not p.is_file():
                      critical.append(f"Falta alias técnico `/{alias}/`.")
                      continue
                  alias_html=p.read_text(encoding="utf-8",errors="replace")
                  if canonical not in alias_html or target not in alias_html:
                      critical.append(f"Alias técnico `/{alias}/` requiere revisión humana.")
              home=(root/"index.html").read_text(encoding="utf-8",errors="replace")
              if '"@type": "Restaurant"' not in home and '"@type":"Restaurant"' not in home:
                  critical.append("Falta schema `Restaurant`. REVISIÓN HUMANA.")

          if Path("/tmp/push_failed").exists():
              critical.append("SEO AUTO no pudo guardar su corrección en GitHub.")

          critical=list(dict.fromkeys(critical)); warnings=list(dict.fromkeys(warnings))
          status="critical" if critical else ("warning" if warnings else "ok")

          title="LIGERA" if mode=="light" else "COMPLETA"
          body=[f"# AUDITOR SEO CARACOLES — {title}","",f"**Estado:** {status.upper()}",""]
          if mode=="full":
              body += ["**Reloj principal:** 03:17 Europe/Madrid",""]
          if critical:
              body += ["## 🔴 Revisión humana",""]+[f"- {x}" for x in critical]+[""]
          if warnings:
              body += ["## 🟡 Avisos cartas/vinos",""]+[f"- {x}" for x in warnings]+[
                "","Las cartas y cartas de vinos nunca se modifican automáticamente.",""]
          if not critical and not warnings:
              body += ["No se han detectado problemas.",""]
          if mode=="light":
              body += ["Auditoría ligera tras cada push. Auditoría completa: 03:17 Europe/Madrid.",""]

          Path("/tmp/report.md").write_text("\n".join(body),encoding="utf-8")
          Path("/tmp/status.txt").write_text(status,encoding="utf-8")
          print("\n".join(body))
          PY
          echo "status=$(cat /tmp/status.txt)" >> "$GITHUB_OUTPUT"

      - name: Crear o actualizar Issue
        if: steps.audit.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LABEL="seo-auditor"
          if [[ "${{ steps.audit.outputs.status }}" == "warning" ]]; then
            TITLE="🟡 AUDITOR SEO CARACOLES — aviso"
            COLOR="FBCA04"
          else
            TITLE="⚠️ AUDITOR SEO CARACOLES — incidencia detectada"
            COLOR="D93F0B"
          fi
          gh label create "$LABEL" --color "$COLOR" --description "Avisos SEO automáticos" --force >/dev/null 2>&1 || true
          ISSUE="$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [[ -n "$ISSUE" && "$ISSUE" != "null" ]]; then
            gh issue edit "$ISSUE" --title "$TITLE" --body-file /tmp/report.md
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file /tmp/report.md
          fi

      - name: Cerrar Issue si todo está correcto
        if: steps.audit.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ISSUE="$(gh issue list --state open --label "seo-auditor" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [[ -n "$ISSUE" && "$ISSUE" != "null" ]]; then
            gh issue comment "$ISSUE" --body "✅ AUDITOR SEO CARACOLES vuelve a estar correcto."
            gh issue close "$ISSUE"
          fi

      - name: Marcar incidencia crítica
        if: steps.audit.outputs.status == 'critical'
        run: exit 1
